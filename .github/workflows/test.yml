name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check bin/cli.js && node --check src/collector.js && node --check viewer/element.js
      - name: Test CLI initialization
        run: |
          mkdir /tmp/ecosystem-rankings-test
          cd /tmp/ecosystem-rankings-test
          node "$GITHUB_WORKSPACE/bin/cli.js" init
          test -f ecosystems.json
          test -f .github/workflows/ecosystem-rankings.yml
          node "$GITHUB_WORKSPACE/bin/cli.js" init
